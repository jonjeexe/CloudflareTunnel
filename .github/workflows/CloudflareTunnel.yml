name: Cloudflare tunnel SSH

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Setup SSH Access (limit to actor only)
        run: |
          mkdir -p ~/.ssh
          curl -s https://github.com/${{ github.actor }}.keys >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys
          echo "SSH keys added for: ${{ github.actor }}"

      - name: Create User, Hostname & Auto-login
        env:
          GH_ACTOR: ${{ github.actor }}
        run: |
          # Linux usernames must be lowercase
          USERNAME=$(echo "$GH_ACTOR" | tr '[:upper:]' '[:lower:]')

          # Create user (password = root)
          sudo adduser --disabled-password --gecos "" "$USERNAME"
          echo "$USERNAME:root" | sudo chpasswd
          sudo usermod -aG sudo "$USERNAME"
          echo "$USERNAME ALL=(ALL:ALL) ALL" | sudo tee -a /etc/sudoers
          sudo visudo -c

          # Hostname
          sudo hostnamectl set-hostname exe
          echo "127.0.0.1 exe" | sudo tee -a /etc/hosts

          # Copy SSH keys to new user
          sudo mkdir -p /home/$USERNAME/.ssh
          sudo cp ~/.ssh/authorized_keys /home/$USERNAME/.ssh/authorized_keys
          sudo chown -R $USERNAME:$USERNAME /home/$USERNAME/.ssh
          sudo chmod 700 /home/$USERNAME/.ssh
          sudo chmod 600 /home/$USERNAME/.ssh/authorized_keys

          # Bash colors for new user
          sudo tee -a /home/$USERNAME/.bashrc > /dev/null << 'EOF'
          export PS1="\[\e[1;32m\]\u\[\e[0m\]\[\e[1;37m\]@\[\e[0m\]\[\e[1;31m\]\h\[\e[0m\]:\[\e[1;34m\]\w\[\e[0m\] \$ "
          alias ls='ls --color=auto'
          alias grep='grep --color=auto'
          alias egrep='egrep --color=auto'
          alias fgrep='fgrep --color=auto'
          alias pkg='apt'
          EOF
          echo "source ~/.bashrc" | sudo tee -a /home/$USERNAME/.bash_profile
          sudo chown $USERNAME:$USERNAME /home/$USERNAME/.bashrc /home/$USERNAME/.bash_profile

          # Auto switch: SSH as runner -> su - username
          cat >> ~/.bash_profile << EOF
          if [ -n "\$SSH_CONNECTION" ]; then
            exec sudo su - $USERNAME
          fi
          EOF

          echo "User created: $USERNAME (password: root)"

      - name: Install Cloudflared & Tmux
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x ./cloudflared
          sudo mv ./cloudflared /usr/local/bin/cloudflared
          cloudflared --version
          sudo apt-get install -y tmux

      - name: Start Cloudflare Tunnel & Print SSH Command
        env:
          GH_ACTOR: ${{ github.actor }}
        run: |
          USERNAME=$(echo "$GH_ACTOR" | tr '[:upper:]' '[:lower:]')
          cloudflared tunnel --url tcp://localhost:22 > /tmp/cf.log 2>&1 &

          echo "Waiting for tunnel..."
          for i in $(seq 1 15); do
            CF_URL=$(grep -o 'https://.*\.trycloudflare\.com' /tmp/cf.log | head -1)
            if [ -n "$CF_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$CF_URL" ]; then
            echo "Tunnel failed to start. Log:"
            cat /tmp/cf.log
            exit 1
          fi

          echo "============================================"
          echo "  Tunnel is ready!"
          echo "============================================"
          echo "."
          echo "  STEP 1 - Install cloudflared on Termux:"
          echo "    pkg install cloudflared"
          echo "."
          echo "--------------------------------------------"
          echo "  STEP 2 - Connect via SSH:"
          echo "."
          echo "    ssh -o StrictHostKeyChecking=no \\"
          echo "      -o ProxyCommand='cloudflared access tcp \\"
          echo "      --hostname ${CF_URL}' \\"
          echo "      ${USERNAME}@localhost"
          echo "."
          echo "--------------------------------------------"
          echo "  STEP 3 - Start tmux first:"
          echo "    tmux new -s main"
          echo "."
          echo "  Reconnecting after disconnect:"
          echo "    tmux attach -t main"
          echo "."
          echo "============================================"
          echo "  Tunnel URL: ${CF_URL}"
          echo "  Triggered by: ${{ github.actor }}"
          echo "============================================"

          sleep 21600
          
